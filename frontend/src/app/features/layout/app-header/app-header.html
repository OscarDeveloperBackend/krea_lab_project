<header class="w-full bg-[#121212] text-zinc-400 font-sans border-b border-zinc-800">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="text-lg font-bold text-white tracking-wide">Krea Lab PRINT</div>

    <nav class="flex items-center h-full gap-8 text-sm font-medium">
      <a routerLink="/stl/form-panel" routerLinkActive="text-[#ff5744] [&>span:nth-child(2)]:scale-x-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative flex items-center h-full hover:text-white transition-colors duration-200">
        <span>Formulario 3D</span>
        <span
          class="absolute bottom-0 left-0 w-full h-[3px] bg-[#ff5744] scale-x-0 origin-left transition-transform duration-200"></span>
      </a>

      <a routerLink="/stl/admin-panel" routerLinkActive="text-[#ff5744] [&>span:nth-child(2)]:scale-x-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative flex items-center h-full hover:text-white transition-colors duration-200">
        <span>Tabla administrativa</span>
        <span
          class="absolute bottom-0 left-0 w-full h-[3px] bg-[#ff5744] scale-x-0 origin-left transition-transform duration-200"></span>
      </a>
    </nav>
  </div>
</header>
