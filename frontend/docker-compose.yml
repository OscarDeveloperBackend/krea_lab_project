services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: krea_lab_frontend_dev:latest
    container_name: krea_lab_frontend_dev
    ports:
      - '4200:4200'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NG_CLI_ANALYTICS=false
    stdin_open: true
    tty: true
