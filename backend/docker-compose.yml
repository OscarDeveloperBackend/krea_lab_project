services:
  postgres_db:
    image: postgres:15-alpine
    container_name: krea_lab_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oscar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krea_lab_project123}
      POSTGRES_DB: ${POSTGRES_DB:-krealab_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oscar} -d ${POSTGRES_DB:-krealab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: krea_lab_backend_dev:latest
    container_name: krea_lab_backend_dev
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-oscar}:${POSTGRES_PASSWORD:-krea_lab_project123}@postgres_db:5432/${POSTGRES_DB:-krealab_db}?schema=public"
      PORT: 3100
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:

